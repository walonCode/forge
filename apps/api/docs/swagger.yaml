basePath: /
definitions:
  auth.AuthResponse:
    properties:
      data:
        $ref: '#/definitions/auth.AuthResponseData'
      message:
        type: string
    type: object
  auth.AuthResponseData:
    properties:
      access_token:
        type: string
      refresh_token:
        type: string
    type: object
  auth.LoginRequest:
    properties:
      password:
        minLength: 8
        type: string
      username:
        minLength: 2
        type: string
    required:
    - password
    - username
    type: object
  auth.RefreshRequest:
    properties:
      refresh_token:
        type: string
    required:
    - refresh_token
    type: object
  auth.SignupRequest:
    properties:
      name:
        minLength: 2
        type: string
      password:
        minLength: 8
        type: string
      username:
        minLength: 2
        type: string
    required:
    - name
    - password
    - username
    type: object
  health.HealthResponse:
    properties:
      db:
        type: string
      status:
        type: string
      uptime:
        type: string
      version:
        type: string
    type: object
  health.ReadinessResponse:
    properties:
      checks:
        additionalProperties:
          type: string
        type: object
      status:
        type: string
    type: object
  tasks.CreateTaskRequest:
    properties:
      description:
        minLength: 2
        type: string
      title:
        minLength: 2
        type: string
    required:
    - description
    - title
    type: object
  tasks.TaskResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  tasks.UpdateTaskRequest:
    properties:
      isCompleted:
        type: boolean
    type: object
  users.UpdatePasswordRequest:
    properties:
      current_password:
        minLength: 8
        type: string
      new_password:
        minLength: 8
        type: string
    required:
    - current_password
    - new_password
    type: object
  users.UpdateProfileRequest:
    properties:
      name:
        minLength: 2
        type: string
      username:
        minLength: 2
        type: string
    type: object
  users.UserResponse:
    properties:
      data: {}
      message:
        type: string
    type: object
  utils.Error:
    properties:
      error:
        type: string
      ok:
        type: boolean
    type: object
host: localhost:8080
info:
  contact: {}
  description: Task management API for Forge.
  title: Forge API
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate a user and return access and refresh tokens
      parameters:
      - description: Login credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
      summary: Login
      tags:
      - auth
  /auth/logout:
    post:
      description: Stateless logout. Tokens are not tracked server-side, so the client
        should discard them.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
      summary: Logout
      tags:
      - auth
  /auth/refresh:
    post:
      consumes:
      - application/json
      description: Exchange a valid refresh token for a new access/refresh token pair
      parameters:
      - description: Refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
      summary: Refresh tokens
      tags:
      - auth
  /auth/signup:
    post:
      consumes:
      - application/json
      description: Register a new user and return access and refresh tokens
      parameters:
      - description: Signup details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.SignupRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/auth.AuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      summary: Signup
      tags:
      - auth
  /health:
    get:
      description: Returns API liveness status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.HealthResponse'
      summary: Health check
      tags:
      - health
  /health/ready:
    get:
      description: Returns API and dependency readiness status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/health.ReadinessResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/health.ReadinessResponse'
      summary: Readiness check
      tags:
      - health
  /task:
    post:
      consumes:
      - application/json
      description: Create a new task for the authenticated user
      parameters:
      - description: Task details
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tasks.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/tasks.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Create a task
      tags:
      - tasks
  /task/{id}:
    delete:
      description: Delete a task by ID for the authenticated user
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
          schema:
            $ref: '#/definitions/tasks.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Get a task by ID for the authenticated user
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Get a single task details
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: Change the isCompleted field for an authenticated user
      parameters:
      - description: Task ID
        in: path
        name: id
        required: true
        type: string
      - description: Update payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/tasks.UpdateTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.TaskResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Update a single task details
      tags:
      - tasks
  /tasks:
    get:
      description: Retrieve all tasks for the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/tasks.TaskResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Get all tasks
      tags:
      - tasks
  /user:
    delete:
      description: Permanently delete the authenticated user's account and all associated
        data
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Delete account
      tags:
      - users
  /user/password:
    patch:
      consumes:
      - application/json
      description: Change the authenticated user's password (requires the current
        password)
      parameters:
      - description: Current and new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.UpdatePasswordRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Update password
      tags:
      - users
  /user/profile:
    get:
      description: Get the authenticated user's profile
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Get profile
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Update the authenticated user's name and/or username
      parameters:
      - description: Fields to update
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/users.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/users.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/utils.Error'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/utils.Error'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/utils.Error'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/utils.Error'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/utils.Error'
      security:
      - BearerAuth: []
      summary: Update profile
      tags:
      - users
securityDefinitions:
  BearerAuth:
    description: Type "Bearer" followed by your token, e.g. "Bearer eyJhbGci..."
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
